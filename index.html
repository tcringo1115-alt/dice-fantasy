<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灯を盗んだ塔</title><style>body{margin:0;padding:24px 12px;background:#0e1118}button:disabled{opacity:.45;cursor:default}</style></head><body>
<div id="ember-book">
<style>
#ember-book{color-scheme:dark;background:#151922;color:#eee7d5;border-radius:18px;padding:22px;max-width:680px;margin:auto;font-family:system-ui,sans-serif;line-height:1.8}#ember-book *{box-sizing:border-box}#ember-book h1{font-size:27px;margin:4px 0}#ember-book h2{font-size:21px}#ember-book .eyebrow{color:#e4ba72;letter-spacing:.16em;font-size:12px}#ember-book .stats{display:flex;flex-wrap:wrap;gap:12px;padding:12px 0;border-bottom:1px solid #424652}#ember-book .scene{min-height:160px}#ember-book button{font:inherit;color:#eee7d5;background:#292f3d;border:1px solid #515867;border-radius:10px;padding:12px 16px;cursor:pointer;text-align:left;touch-action:manipulation}#ember-book button:hover{background:#394154}#ember-book button:focus-visible{outline:3px solid #e4ba72}#ember-book .choices{display:grid;gap:9px}#ember-book .primary{background:#76532a;border-color:#b58b50}#ember-book .dice{font-size:35px;color:#e4ba72;text-align:center;min-height:56px}#ember-book .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}#ember-book .tools button{font-size:13px;padding:8px 12px}#ember-book .muted{color:#c1bdba;font-size:13px}#ember-book .notice{background:#222938;border-radius:8px;padding:10px;margin:12px 0}#ember-book progress{width:100%;height:8px;accent-color:#e4ba72}#ember-book summary{cursor:pointer}#ember-book .art{height:82px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#d9b36c;background:radial-gradient(ellipse at center,#4c3941,transparent 70%);font-size:50px;letter-spacing:12px}@media(max-width:420px){#ember-book{padding:16px}#ember-book h1{font-size:24px}}
</style>
<div class="eyebrow">DICE & STORY · 読む、選ぶ、運を試す</div>
<h1>灯を盗んだ塔</h1><div class="muted">オリジナル・ゲームブック／約10〜15分</div>
<div class="art" aria-hidden="true">☾ ♜ ✧</div>
<div class="stats" id="eb-stats"></div><progress id="eb-health" max="24" value="24" aria-label="生命力"></progress>
<div id="eb-scene" class="scene"></div><div id="eb-dice" class="dice" aria-live="polite"></div><div id="eb-notice" class="notice" aria-live="polite" hidden></div><div id="eb-choices" class="choices"></div>
<div class="tools"><button id="eb-potion">回復薬を飲む</button><button id="eb-save">セーブ</button><button id="eb-load">ロード</button><button id="eb-reset">最初から</button></div>
<details class="muted"><summary>遊び方</summary><p>選択肢を押して進みます。判定は20面ダイス＋能力値が目標以上なら成功。戦闘は出目＋技術が敵の防御以上なら命中し、6面ダイスでダメージを決めます。20は大成功、1は失敗。敵も反撃します。回復薬は生命力を10回復。防御しながら薬を飲むと、反撃を1に抑えます。セーブはこの端末・ブラウザーに保存します。</p></details>
<script>
(()=>{const root=document.getElementById('ember-book'),$=id=>root.querySelector('#eb-'+id),KEY='ember-book-v1';let s,notice='',dice='';const fresh=()=>({version:1,node:'start',hp:24,max:24,skill:4,wit:3,potions:3,items:[],flags:[],enemy:null,ending:false});const roll=n=>Math.floor(Math.random()*n)+1;
const scenes={
start:['消えた朝','村から朝が消えた。夜明けの鐘が鳴っても、空は黒いまま。丘の上の塔にだけ、金色の光がともっている。門番の少女ミナが言う。「灯を取り戻して。でも、塔の声を信じすぎないで。」',[['剣を持つ旅人で始める',()=>{s.skill=6;s.wit=2;go('gate')}],['知恵を使う旅人で始める',()=>{s.skill=4;s.wit=5;go('gate')}]]],
gate:['塔の入口','門には二つの入口がある。正面の扉の奥では、鎖が石を引きずる音。脇の排水路からは、小さな鼻歌が聞こえる。',[['正面の扉を開ける',()=>fight('鎖の番兵',12,12,3,'hall')],['排水路にもぐる',()=>go('drain')]]],
drain:['暗がりの鼻歌','落ちた灯を拾っている小さな獣人がいる。あなたを見ても逃げない。「上の人は、ひとりで夜を抱えてるんだ。」',[['獣人に話を聞く',()=>{add('銀の鈴');go('hall','銀の鈴をもらった。「声が嘘をついたら鳴らして。」')}],['光る水たまりを調べる（知恵・目標12）',()=>check('wit',12,()=>{add('月の鍵');go('hall','水の底から月の鍵を拾った。')},()=>{s.hp-=3;go('hall','冷たい水に足を取られ、生命力−3。')})]]],
hall:['三つの扉','広間に三つの扉。書庫の扉は温かい。武器庫の扉には深い爪痕。階段には、子供ほどの足跡が残っている。',[['書庫へ',()=>go('library')],['武器庫へ',()=>fight('錆の獣',10,11,3,'armory')],['足跡を追って上階へ',()=>go('stairs')]]],
library:['忘れられた記録','机に開かれた日記。「灯守は夜を閉じ込める。だが灯守の名が忘れられると、夜は心から漏れ出す。」最後の頁に、消されかけた名前がある。',[['名前を読み解く（知恵・目標13）',()=>check('wit',13,()=>{add('灯守の名');go('rest','名前は「エリオ」。その文字だけが、まだ温かい。')},()=>go('rest','文字がほどけてしまった。ただ、灯守が誰かを待っていることは分かった。'))],['日記を閉じて進む',()=>go('rest')]]],
armory:['まだ光る剣','錆びた武器の中に、刃先だけ光る短剣がある。握ると、遠い鐘の音がした。',[['星鉄の剣を持って進む',()=>{add('星鉄の剣');s.skill+=1;go('rest','技術＋1。')}]]],
rest:['旅人の小部屋','小部屋には水差しと椅子。壁に刻まれた言葉は「引き返すのも勇気」。窓の下で、村の灯が一つ消えた。',[['少し休む',()=>{s.hp=Math.min(s.max,s.hp+5);go('stairs','生命力＋5。')}],['急いで階段を上る',()=>{s.potions++;go('stairs','棚の回復薬を一つ持って進んだ。')}]]],
stairs:['夜を渡る橋','階段の先は底の見えない裂け目。細い橋の中央で、影があなたの姿をまねている。「ここから帰れ。村はお前を忘れる。」',[['影と戦う',()=>fight('まねる影',14,13,4,'door')],['銀の鈴を鳴らす',()=>{if(has('銀の鈴'))go('door','澄んだ音に、影はほどけた。');else say('銀の鈴を持っていない。別の道を選ぼう。')}],['橋の下の鎖を渡る（技術・目標14）',()=>check('skill',14,()=>go('door','鎖を渡り、影の背後へ抜けた。'),()=>{s.hp-=5;go('door','手を滑らせたが、なんとか対岸へ。生命力−5。')})]]],
door:['月の扉','頂上の扉には月形の鍵穴。扉の向こうで「僕は悪い魔法使いじゃない」と声がする。足元に、古い扉を押すための鉄の棒がある。',[['月の鍵で開く',()=>{if(has('月の鍵')){s.flags.push('gentle');go('keeper')}else say('月の鍵を持っていない。')}],['仕掛けを解く（知恵・目標12）',()=>check('wit',12,()=>{s.flags.push('gentle');go('keeper','扉は静かに開いた。')},()=>fight('扉の石像',10,12,3,'keeper'))],['鉄の棒でこじ開ける',()=>{s.hp-=2;go('keeper','破片で手を切った。生命力−2。')}]]],
keeper:['灯守','部屋の中央に、少年の姿をした灯守がいる。胸の中で朝の光が震えている。「僕が眠ったら、夜が村へ落ちる。だから、朝をここに置いておくしかないんだ。」',[['灯守の名を呼ぶ',()=>{if(has('灯守の名'))go('name');else say('名前を知らない。言葉が見つからなかった。')}],['村のみんなで夜を引き受けようと話す（知恵・目標14）',()=>check('wit',14,()=>go('name','灯守の目から、光る涙が一粒落ちた。'),()=>go('choice','「人は、忘れる。」少年の影が膨らんだ。'))],['灯を取り戻すため剣を抜く',()=>go('choice')]]],
name:['忘れない約束','「村に戻って、君のことを話す。ひとりで守らなくていい。」少年が手を差し出す。その小さな掌には、朝の灯と、夜の種。',[['夜の種を分け合って持ち帰る',()=>end('夜を分け合う朝','村人は一人ずつ小さな夜を受け取った。悲しい日も、眠れない日もある。それでも誰かの窓に灯がある。朝は戻り、丘の塔から少年が降りてきた。','真の結末')],['朝の灯だけ持ち帰る',()=>end('ひとつ残った窓','村に朝は戻った。けれど丘の窓には、今夜も一つの灯がともる。あなたはその灯を見上げ、名前を忘れないと約束した。','静かな結末')]]],
choice:['ほどける影','少年の影が天井まで伸びる。灯は、その胸から取り出せる。しかし剣を振れば、少年はもう戻らないかもしれない。',[['剣で影を断つ',()=>fight('夜の巨影',22,14,5,'victory')],['最後に、手を差し出す（知恵・目標15）',()=>check('wit',15,()=>go('name','震える手が、あなたの手をつかんだ。'),()=>fight('夜の巨影',18,14,4,'victory'))],['今は引き返す',()=>end('灯を探す旅','空はまだ暗い。あなたは村へ戻り、見聞きしたことを伝えた。次は一人で登らない。塔への道に、いくつもの足音が重なり始めた。','帰還の結末')]]],
victory:['夜のあと','巨影が崩れ、朝の灯が床に転がった。少年の姿はもうない。',[['灯を村へ持ち帰る',()=>end('取り戻した朝','空が白み、村に歓声が上がる。あなたは英雄になった。けれど祝宴の鐘の音に、一人の少年の声が重なって聞こえた。','剣の結末')]]]
};
function has(x){return s.items.includes(x)}function add(x){if(!has(x))s.items.push(x)}function say(x){notice=x;render()}function go(n,msg=''){s.node=n;s.enemy=null;notice=msg;if(s.hp<=0){end('冒険の終わり','あなたはその場に膝をついた。最後に見えたのは、塔の窓の小さな灯。別の道を選べば、違う朝が待っている。','ゲームオーバー');return}render()}
function end(title,body,label){s.ending=true;s.enemy=null;s.end={title,body,label};notice='';render()}
function check(stat,target,yes,no){const d=roll(20);dice='🎲 '+d;notice=`D20 ${d} ＋ ${stat==='wit'?'知恵':'技術'} ${s[stat]} ／目標 ${target}`;const result=notice;(d===20||(d!==1&&d+s[stat]>=target))?yes():no();notice=result+' → '+(notice||'判定終了');render()}
function fight(name,hp,ac,damage,next){s.enemy={name,hp,max:hp,ac,damage,next};notice='';render()}
function attack(){const e=s.enemy;if(!e)return;const d=roll(20);dice='🎲 '+d;let msg=`あなた：${d}＋${s.skill}／敵の防御${e.ac}。`;if(d===20||(d!==1&&d+s.skill>=e.ac)){const hit=roll(6)+2+(d===20?4:0);e.hp-=hit;msg+=`${hit}ダメージ！`}else msg+='攻撃は外れた。';if(e.hp<=0){go(e.next,msg+' 敵を倒した。');return}const r=roll(20);if(r===20||(r!==1&&r+3>=12)){s.hp-=e.damage;msg+=` 敵の反撃で生命力−${e.damage}。`}else msg+=' 敵の反撃をかわした。';if(s.hp<=0){go(s.node);return}say(msg)}
function potion(){if(s.ending||s.node==='start')return;if(s.potions<=0){say('回復薬は残っていない。');return}if(s.hp===s.max){say('生命力は満タン。薬は取っておこう。');return}s.potions--;const before=s.hp;s.hp=Math.min(s.max,s.hp+10);let msg=`生命力を${s.hp-before}回復。`;if(s.enemy){s.hp--;msg+=' 防御しながら飲んだ。敵の反撃で生命力−1。'}say(msg)}
function button(label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>{dice='';fn()};$('choices').append(b)}
function render(){ $('stats').textContent=`♥ ${s.hp} / ${s.max}　⚔ 技術 ${s.skill}　✧ 知恵 ${s.wit}　薬 ${s.potions}`;$('health').value=Math.max(0,s.hp);$('dice').textContent=dice;$('notice').hidden=!notice;$('notice').textContent=notice;$('choices').replaceChildren();let title,body,choices;if(s.ending){({title,body}=s.end);choices=[['もう一度、別の道を歩く',reset]]}else if(s.enemy){title=s.enemy.name;body=`敵の生命力 ${Math.max(0,s.enemy.hp)} / ${s.enemy.max} · 防御 ${s.enemy.ac}\n剣を振るか、薬を飲んで次の一撃に備えるか。`;choices=[['🎲 サイコロを振って攻撃',attack]]}else [title,body,choices]=scenes[s.node];$('scene').replaceChildren();const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=body;$('scene').append(h,p);if(s.ending){const label=document.createElement('div');label.className='eyebrow';label.textContent=s.end.label;$('scene').append(label)}if(s.items.length){const inv=document.createElement('div');inv.className='muted';inv.textContent='持ち物：'+s.items.join('・');$('scene').append(inv)}choices.forEach(c=>button(...c));$('choices').firstChild?.classList.add('primary');$('potion').disabled=s.ending||s.node==='start'||s.potions===0;}
function reset(){s=fresh();notice='';dice='';render()}
$('potion').onclick=potion;$('reset').onclick=()=>{if(confirm('今の冒険を終えて、最初から始めますか？'))reset()};$('save').onclick=()=>{try{localStorage.setItem(KEY,JSON.stringify(s));say('この端末にセーブしました。')}catch{say('この画面では保存を利用できません。画面を開いたまま遊べます。')}};$('load').onclick=()=>{try{const v=JSON.parse(localStorage.getItem(KEY));if(!v||v.version!==1||!scenes[v.node]||!Number.isFinite(v.hp)||!Array.isArray(v.items)||!Array.isArray(v.flags))throw Error();s=v;dice='';say('セーブした冒険を再開しました。')}catch{say('読み込めるセーブがありません。')}};reset();
})();
</script>
</div>

</body></html>
